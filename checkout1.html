<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" href="css/checkout1style.css">
</head>

<body>

    <center>

        <main>

            <form action="landing.html" method="get">

                <section>
                    <h2>Shipping Information</h2>
                    <br><br>
                    <table border="0">
                        <tr>
                            <td>
                                <fieldset>
                                    <legend><b>Shipping Address</b></legend>

                                    <label for="fullname">Full Name:</label>
                                    <input type="text" id="fullname" name="fullname" required size="30"><br><br>

                                    <label for="street">Street Address:</label>
                                    <input type="text" id="street" name="street" required size="30"><br><br>

                                    <label for="zip">ZIP Code:</label>
                                    <input type="text" id="zip" name="zip" required size="30">
                                </fieldset>
                            </td>
                        </tr>
                    </table>
                </section>

                <br>

                <section>
                    <h2>Payment Method</h2>

                    <label>
                        <input type="radio" name="payment" value="credit" required>
                        Credit Card
                    </label><br>

                    <label>
                        <input type="radio" name="payment" value="paypal">
                        PayPal
                    </label>
                </section>

                <br>

                <aside>
                    <h2>Order Summary</h2>
                    <p>Items: ₱473</p>
                    <p>Shipping: ₱100</p>
                    <p><strong>Total: ₱573</strong></p>
                </aside>

                <br>

                <button type="submit">Place Order</button>

            </form>

        </main>

    </center>

</body>

</html>
