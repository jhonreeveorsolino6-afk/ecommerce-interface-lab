<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" href="css/checkout2style.css">
</head>

<body>

    <center>

        <main>

            <section>
                <h2>Shipping Information</h2>
                <form>

                    <fieldset>
                        <legend>Shipping Address</legend>

                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" required size="30"><br><br>

                        <label for="street">Street Address:</label>
                        <input type="text" id="street" required size="30"><br><br>

                        <label for="zip">ZIP Code:</label>
                        <input type="text" id="zip" required size="30">

                    </fieldset>

                </form>
            </section>

            <br>

            <section>
                <h2>Payment Method</h2>
                <form>
                    <label>
                        <input type="radio" name="payment" required>
                        Credit Card
                    </label><br>

                    <label>
                        <input type="radio" name="payment">
                        PayPal
                    </label><br><br>
            </section>

            <br>

            <aside>
                <h2>Order Summary</h2>
                <p>Items: ₱250</p>
                <p>Shipping: ₱120</p>
                <p><strong>Total: ₱370</strong></p>
            </aside>

            <button type="submit">Place Order</button>
            </form>

        </main>

    </center>

</body>

</html>
