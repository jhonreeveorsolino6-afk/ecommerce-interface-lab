<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <body>
        <div align="right">
            <a href="landing.html">Home</a>
            <a href="cart.html">Cart</a>
            <a href="account.html">Account</a>
        </div>
        <center>

            <form action="landing.html" method="get">

            </form>
            <div class="checkout-container">
                <fieldset class="shipping">
                    <legend>Shipping Information</legend>
                    <fieldset>
                        <legend><b>Shipping Address</b></legend>

                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname" required size="30"><br><br>

                        <label for="street">Street Address:</label>
                        <input type="text" id="street" name="street" required size="30"><br><br>

                        <label for="zip">ZIP Code:</label>
                        <input type="text" id="zip" name="zip" required size="30">
                    </fieldset>
                </fieldset>

                <br>

                <aside class="Payment Method">
                    <h3>Payment Method</h3>
                    <label>
                        <input type="radio" name="payment" value="credit" required>
                        Credit Card
                    </label><br>

                    <label>
                        <input type="radio" name="payment" value="paypal">
                        PayPal
                    </label>
                </aside>
                <br>

                <aside class="order-summary">
                    <h3>Order Summary</h3>
                    <p>Items: ₱473</p>
                    <p>Shipping: ₱100</p>
                    <p><strong>Total: ₱573</strong></p>
                </aside>
            </div>

            <main>


                <button type="submit">Place Order</button>
                </form>

            </main>

        </center>
        <br><br><br>
    </body>

</html>
